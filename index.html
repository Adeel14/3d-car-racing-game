<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Car Racing Game</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="hud">
      <div class="panel">
        <span>Score</span>
        <strong id="score">0</strong>
      </div>
      <div class="panel">
        <span>Speed</span>
        <strong id="speed">0</strong>
      </div>
    </div>

    <div id="message" class="visible">
      <h1>3D Car Racing</h1>
      <p>Use A/D or Arrow Keys to steer</p>
      <p>Press R to restart after a crash</p>
      <button id="startButton">Start Race</button>
    </div>

    <script type="module" src="script.js"></script>
  </body>
</html>
